apiVersion: v1
kind: Service
metadata:
  name: {{ include "pintalent-mail.postgresName" . }}
  labels:
    {{- include "pintalent-mail.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgresql.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "pintalent-mail.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
