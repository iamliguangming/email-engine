apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pintalent-mail.workerName" . }}
  labels:
    {{- include "pintalent-mail.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "pintalent-mail.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "pintalent-mail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with .Values.rolloutToken }}
      annotations:
        pintalent.ai/rollout-token: {{ . | quote }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - -e
          args:
            - |
              const url = "http://{{ include "pintalent-mail.apiName" . }}:{{ .Values.api.port }}/health";
              const wait = async () => {
                try {
                  const response = await fetch(url);
                  if (response.ok) process.exit(0);
                } catch {}
                setTimeout(wait, 2000);
              };
              wait();
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "pintalent-mail.runtimeEnv" . | nindent 12 }}
            - name: MAIL_ROLE
              value: "worker"
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
