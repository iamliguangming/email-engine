{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pintalent-mail.secretName" . }}
  labels:
    {{- include "pintalent-mail.labels" . | nindent 4 }}
type: Opaque
stringData:
  MAIL_PG_PASSWORD: {{ required "secret.pgPassword is required when existingSecret is empty" .Values.secret.pgPassword | quote }}
  MAIL_SECRET: {{ required "secret.mailSecret is required when existingSecret is empty" .Values.secret.mailSecret | quote }}
  MAIL_ADMIN_TOKEN: {{ required "secret.adminToken is required when existingSecret is empty" .Values.secret.adminToken | quote }}
  MAIL_HOST_GATEWAY_SECRET: {{ required "secret.hostGatewaySecret is required when existingSecret is empty" .Values.secret.hostGatewaySecret | quote }}
{{- end }}
